<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kraemer Cubs · Disease Detectives Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== THEME: change these to match the official Kraemer colors ===== */
  :root {
    --navy: #0b2a5b;
    --navy-dark: #061a3a;
    --gold: #f2b705;
    --gold-soft: #fff4cc;
    --ink: #13213a;
    --muted: #5a6680;
    --bg: #f4f6fb;
    --card: #ffffff;
    --good: #1f8a4c;
    --good-soft: #e3f5ea;
    --bad: #c0392b;
    --bad-soft: #fbe6e3;
    --line: #d9dfeb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Source Sans 3", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 150px; /* room for the fixed scoreboard */
  }

  /* ===== Header ===== */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: #fff;
    border-bottom: 6px solid var(--gold);
  }
  .header-inner {
    max-width: 960px; margin: 0 auto; padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .logo-wrap { width: 64px; height: 64px; flex: none; }
  .logo-wrap img { width: 64px; height: 64px; object-fit: contain; border-radius: 50%; background: #fff; }
  .logo-fallback {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--gold); border: 3px solid #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .brand h1 {
    font-family: "Bebas Neue", Impact, sans-serif;
    font-weight: 400; letter-spacing: 1px;
    font-size: clamp(26px, 5vw, 38px); margin: 0; line-height: 1;
  }
  .brand h1 span { color: var(--gold); }
  .brand p { margin: 4px 0 0; font-size: 14px; opacity: .85; }
  .header-actions { margin-left: auto; display: flex; gap: 8px; }
  .ghost-btn {
    background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,.5);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ===== Progress ===== */
  .progress-wrap { max-width: 960px; margin: 18px auto 0; padding: 0 16px; }
  .progress-meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .progress-bar { height: 10px; background: #e2e7f1; border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold), #ffd54a); transition: width .3s ease; }

  /* ===== Main card ===== */
  main { max-width: 960px; margin: 16px auto; padding: 0 16px; }
  .card {
    background: var(--card); border-radius: 16px; padding: clamp(18px, 4vw, 34px);
    box-shadow: 0 6px 24px rgba(11,42,91,.08); border-top: 6px solid var(--navy);
    animation: rise .25s ease;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tag {
    display: inline-block; background: var(--gold-soft); color: var(--navy);
    font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
    padding: 4px 10px; border-radius: 99px; margin-bottom: 12px;
  }
  .question { font-size: clamp(20px, 3.4vw, 27px); font-weight: 700; line-height: 1.3; margin: 0 0 22px; color: var(--navy); }
  .choices { display: grid; gap: 12px; }
  .choice {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    background: #fff; border: 2px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font: inherit; font-size: 18px; color: var(--ink); cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .choice:hover { border-color: var(--navy); background: #f7f9ff; }
  .choice:active { transform: scale(.99); }
  .choice .letter {
    flex: none; width: 36px; height: 36px; border-radius: 50%;
    background: var(--navy); color: var(--gold); font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .hint { margin-top: 16px; font-size: 13px; color: var(--muted); }

  /* ===== Result screen ===== */
  .verdict { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .verdict .icon {
    width: 56px; height: 56px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 30px; color: #fff; font-weight: 700;
  }
  .verdict.good .icon { background: var(--good); }
  .verdict.bad .icon { background: var(--bad); }
  .verdict h2 { margin: 0; font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 42px; letter-spacing: 1px; line-height: 1; }
  .verdict.good h2 { color: var(--good); }
  .verdict.bad h2 { color: var(--bad); }
  .recap-q { font-size: 17px; color: var(--muted); margin: 0 0 14px; }
  .answer-row { border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; font-size: 17px; }
  .answer-row b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 2px; }
  .answer-row.right { background: var(--good-soft); border-left: 5px solid var(--good); }
  .answer-row.wrong { background: var(--bad-soft); border-left: 5px solid var(--bad); }
  .explain { background: #f6f8fc; border-radius: 10px; padding: 14px 16px; font-size: 16px; line-height: 1.5; margin: 14px 0 20px; }
  .explain b { color: var(--navy); }

  .award h3 { margin: 0 0 4px; color: var(--navy); font-size: 18px; }
  .award p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  .award-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 600px) { .award-grid { grid-template-columns: repeat(2, 1fr); } }
  .award-btn {
    font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    padding: 12px 8px; border-radius: 10px; border: 2px solid var(--navy);
    background: #fff; color: var(--navy); transition: all .15s;
  }
  .award-btn:hover { background: #eef2fb; }
  .award-btn.on { background: var(--navy); color: var(--gold); box-shadow: 0 0 0 3px var(--gold) inset; }
  .award-btn.on::after { content: "  +1"; }

  .nav-row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .primary-btn {
    background: var(--gold); color: var(--navy); border: none; border-radius: 10px;
    padding: 14px 26px; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer;
    box-shadow: 0 3px 0 #b88a00; transition: transform .1s;
  }
  .primary-btn:hover { filter: brightness(1.05); }
  .primary-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b88a00; }
  .secondary-btn {
    background: #fff; color: var(--navy); border: 2px solid var(--navy); border-radius: 10px;
    padding: 12px 22px; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer;
  }
  .secondary-btn:hover { background: #eef2fb; }

  /* ===== Start / end screens ===== */
  .intro h2 { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: 44px; margin: 0 0 6px; color: var(--navy); letter-spacing: 1px; }
  .intro p { font-size: 17px; line-height: 1.5; margin: 0 0 12px; }
  .roster { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 20px; }
  .roster span { background: var(--navy); color: #fff; padding: 6px 12px; border-radius: 99px; font-weight: 600; font-size: 15px; }
  .cat-list { columns: 2; column-gap: 24px; padding-left: 18px; margin: 0 0 18px; color: var(--muted); }
  @media (max-width: 600px) { .cat-list { columns: 1; } }
  .podium { display: grid; gap: 8px; margin: 14px 0 20px; }
  .podium-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px;
    background: #f6f8fc; font-size: 18px;
  }
  .podium-row .rank { width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: var(--gold); font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .podium-row.first { background: var(--gold-soft); border: 2px solid var(--gold); }
  .podium-row .pts { margin-left: auto; font-weight: 700; color: var(--navy); }

  /* ===== Scoreboard (fixed bottom) ===== */
  .scoreboard {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--navy-dark); color: #fff; border-top: 5px solid var(--gold);
    box-shadow: 0 -6px 20px rgba(0,0,0,.18);
  }
  .sb-inner { max-width: 960px; margin: 0 auto; padding: 10px 16px 12px; }
  .sb-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .sb-top .title { font-family: "Bebas Neue", Impact, sans-serif; font-size: 22px; letter-spacing: 1px; color: var(--gold); }
  .sb-top .class-score { opacity: .9; font-weight: 600; }
  .sb-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  @media (max-width: 760px) { .sb-grid { grid-template-columns: repeat(4, 1fr); } body { padding-bottom: 200px; } }
  .sb-chip {
    background: rgba(255,255,255,.08); border-radius: 8px; padding: 6px 4px; text-align: center;
    border: 1.5px solid transparent; position: relative;
  }
  .sb-chip.leader { border-color: var(--gold); background: rgba(242,183,5,.15); }
  .sb-chip .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sb-chip .pt { font-size: 22px; font-weight: 700; color: var(--gold); line-height: 1.1; }
  .sb-chip .adj { display: flex; justify-content: center; gap: 4px; margin-top: 2px; }
  .sb-chip .adj button {
    width: 22px; height: 20px; border-radius: 5px; border: none; cursor: pointer;
    background: rgba(255,255,255,.15); color: #fff; font-size: 13px; line-height: 1; padding: 0;
  }
  .sb-chip .adj button:hover { background: var(--gold); color: var(--navy); }

  .kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 12px; background: #fff; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-wrap" id="logoWrap">
      <!-- Put the school's logo in your repo as kraemer-logo.png (same folder as this file). -->
      <img src="kraemer-logo.png" alt="Kraemer Middle School logo" id="logoImg">
    </div>
    <div class="brand">
      <h1>Kraemer Cubs <span>Disease Detectives</span></h1>
      <p>Famous Epidemiologists &amp; Public Health Figures</p>
    </div>
    <div class="header-actions">
      <button class="ghost-btn" id="homeBtn" title="Back to start screen">Home</button>
    </div>
  </div>
</header>

<div class="progress-wrap" id="progressWrap" hidden>
  <div class="progress-meta"><span id="progressText">Question 1 of 1</span><span id="progressPct">0%</span></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<main id="app"></main>

<div class="scoreboard">
  <div class="sb-inner">
    <div class="sb-top">
      <span class="title">Class Scoreboard</span>
      <span class="class-score" id="classScore">Class answers: 0 correct of 0</span>
    </div>
    <div class="sb-grid" id="sbGrid"></div>
  </div>
</div>

<script>
/* =========================================================
   STUDENTS
   ========================================================= */
const STUDENTS = ["Aria", "Areen", "Ezekiel", "Meera", "Allison", "Dylan", "Emogen", "Isha"];

/* =========================================================
   QUESTION BANK
   Format: [category, question, correct answer, [3 wrong answers], explanation]
   ========================================================= */
const BANK = [
  // ---------- Early foundations ----------
  ["Early Foundations", "Which ancient Greek physician first linked disease to environment and lifestyle in 'On Airs, Waters, and Places'?", "Hippocrates", ["Galen", "Aristotle", "Fracastoro"], "Hippocrates (c. 460–370 BC) moved disease away from the supernatural and toward observable causes like climate, water and way of life."],
  ["Early Foundations", "Hippocrates is credited with using which pair of terms still used in epidemiology today?", "Endemic and epidemic", ["Incidence and prevalence", "Sensitivity and specificity", "Morbidity and mortality"], "Hippocrates distinguished diseases always present in a place (endemic) from those that appear in excess (epidemic)."],
  ["Early Foundations", "Galen's ideas, which dominated medicine for about 1,500 years, centered on what?", "The humoral theory of disease", ["Germ theory", "Vaccination", "Vital statistics"], "Galen (c. 129–216 AD) taught that illness came from imbalances of the four humors, alongside miasma (bad air) ideas."],
  ["Early Foundations", "In 'De Contagione' (1546), Girolamo Fracastoro proposed that disease spreads how?", "By tiny 'seeds' passed by direct contact, fomites, and at a distance", ["Only through bad air (miasma)", "Through an imbalance of the four humors", "Only through mosquito bites"], "Fracastoro's three modes of contagion were a remarkably early version of germ theory."],
  ["Early Foundations", "Girolamo Fracastoro gave which disease its name?", "Syphilis", ["Cholera", "Typhoid", "Malaria"], "Fracastoro named syphilis in a 1530 poem about a shepherd named Syphilus."],
  ["Early Foundations", "Who analyzed London's Bills of Mortality in 1662 and was first to quantify patterns of birth, death and disease?", "John Graunt", ["William Farr", "John Snow", "Thomas Sydenham"], "Graunt's 'Natural and Political Observations' counted deaths by cause and built an early life table."],
  ["Early Foundations", "John Graunt is credited with creating an early version of which tool?", "The life table", ["The spot map", "The epidemic curve", "The 2x2 table"], "Graunt's tables of survival by age were a forerunner of the modern life table."],
  ["Early Foundations", "Which physician was nicknamed 'the English Hippocrates' for his careful clinical observation?", "Thomas Sydenham", ["John Graunt", "Edward Jenner", "James Lind"], "Sydenham (1624–1689) separated diseases such as measles and scarlet fever by careful bedside observation."],
  ["Early Foundations", "Who is known as the father of occupational medicine?", "Bernardino Ramazzini", ["Percivall Pott", "Hippocrates", "Rudolf Virchow"], "Ramazzini wrote 'De Morbis Artificum' (Diseases of Workers, 1700) and urged doctors to ask patients about their jobs."],
  ["Early Foundations", "Ramazzini's famous 1700 book 'De Morbis Artificum' is about what?", "Diseases of workers", ["Contagious diseases", "Bills of mortality", "Cholera in London"], "It was the first systematic study of how occupations cause disease."],
  ["Early Foundations", "Who brought smallpox variolation (inoculation) from the Ottoman Empire to England in 1721?", "Lady Mary Wortley Montagu", ["Florence Nightingale", "Edward Jenner", "S. Josephine Baker"], "Montagu saw variolation in Constantinople and had her own daughter inoculated in England."],
  ["Early Foundations", "In James Lind's 1747 trial aboard HMS Salisbury, which treatment cured scurvy?", "Citrus fruit (oranges and lemons)", ["Vinegar", "Seawater", "Cider"], "Lind tested six treatments on 12 sailors; only the pair given citrus recovered quickly."],
  ["Early Foundations", "James Lind's scurvy study is an early example of which study design?", "A controlled clinical trial", ["A case-control study", "A cohort study", "A cross-sectional survey"], "Lind assigned different treatments to comparable groups and compared outcomes: the core of a clinical trial."],
  ["Early Foundations", "How many sailors were in James Lind's famous scurvy trial?", "12", ["6", "50", "100"], "Twelve sailors were split into six pairs, each pair receiving a different treatment."],
  ["Early Foundations", "In 1760, Daniel Bernoulli created the first mathematical model of an infectious disease. Which disease?", "Smallpox", ["Cholera", "Malaria", "Measles"], "Bernoulli calculated that smallpox inoculation would increase life expectancy despite its risks."],
  ["Early Foundations", "In 1775, Percivall Pott linked scrotal cancer in chimney sweeps to what exposure?", "Soot", ["Arsenic", "Lead", "Asbestos"], "Pott's finding is the first known occupational or environmental carcinogen."],
  ["Early Foundations", "Percivall Pott's famous observation came from studying which group of workers?", "Chimney sweeps", ["Coal miners", "Textile workers", "Sailors"], "Young chimney sweeps had high rates of scrotal cancer from years of soot exposure."],

  // ---------- Founders of modern epidemiology ----------
  ["Modern Epi Founders", "Who is most often called the father of modern field epidemiology?", "John Snow", ["William Farr", "Robert Koch", "Louis Pasteur"], "Snow's 1854 Broad Street investigation is the model for outbreak investigation today."],
  ["Modern Epi Founders", "In which London neighborhood did John Snow investigate the 1854 Broad Street outbreak?", "Soho", ["Westminster", "Southwark", "Whitechapel"], "The Broad Street pump stood in Soho, London."],
  ["Modern Epi Founders", "Which disease was John Snow investigating in 1854?", "Cholera", ["Typhoid", "Smallpox", "Plague"], "Snow argued cholera was spread by contaminated water, not bad air."],
  ["Modern Epi Founders", "What famous action did John Snow persuade officials to take in 1854?", "Remove the handle of the Broad Street pump", ["Close the London water companies", "Quarantine all of Soho", "Burn the houses of the sick"], "Removing the handle stopped people from using the contaminated well."],
  ["Modern Epi Founders", "What tool did John Snow use to show cholera deaths clustered around one pump?", "A spot map", ["An epidemic curve", "A life table", "A polar-area diagram"], "Snow marked each death on a street map; the cluster pointed straight at the Broad Street pump."],
  ["Modern Epi Founders", "Snow's 'Grand Experiment' compared households served by which two groups?", "The Southwark & Vauxhall and the Lambeth water companies", ["The Broad Street and Poland Street pumps", "London and Paris hospitals", "Rich and poor neighborhoods of Soho"], "Southwark & Vauxhall drew sewage-polluted Thames water; Lambeth had moved upstream. Death rates differed sharply."],
  ["Modern Epi Founders", "Snow's comparison of two water companies is an example of what kind of study?", "A natural experiment", ["A randomized controlled trial", "A case-control study", "A cross-sectional survey"], "Households were 'assigned' to water companies by circumstance, not by the investigator."],
  ["Modern Epi Founders", "What is the title of John Snow's book on cholera?", "On the Mode of Communication of Cholera", ["Natural and Political Observations", "Notes on Nursing", "De Contagione"], "First published in 1849, with an expanded second edition in 1855."],
  ["Modern Epi Founders", "Besides epidemiology, John Snow was a pioneer in which field?", "Anesthesia", ["Antiseptic surgery", "Microscopy", "Pasteurization"], "Snow gave chloroform to Queen Victoria during childbirth."],
  ["Modern Epi Founders", "William Farr is best known for building what?", "A national system of vital statistics, the root of modern surveillance", ["The first cholera vaccine", "The first spot map", "The first microscope"], "Farr worked at England's General Register Office from 1839, compiling births, deaths and causes."],
  ["Modern Epi Founders", "What did William Farr originally believe caused cholera?", "Miasma (bad air)", ["Contaminated water", "Mosquitoes", "Body lice"], "Farr linked cholera to elevation and 'bad air' before later accepting Snow's water theory."],
  ["Modern Epi Founders", "William Farr's disease classification work was a forerunner of what?", "The International Classification of Diseases (ICD)", ["Koch's postulates", "The Bradford Hill criteria", "The MMWR"], "Farr pushed for a standard list of causes of death so statistics could be compared."],
  ["Modern Epi Founders", "Who was Henry Whitehead?", "A local curate who helped Snow find the Broad Street index case", ["The doctor who treated Queen Victoria", "The head of the Lambeth water company", "Snow's statistician at the Register Office"], "Whitehead first doubted Snow, then gathered evidence that supported him."],
  ["Modern Epi Founders", "Who used the 'numerical method' to show that bloodletting did not help pneumonia?", "Pierre Charles-Alexandre Louis", ["William Farr", "John Graunt", "Thomas Sydenham"], "Louis compared outcomes by counting, an early form of quantitative clinical research."],
  ["Modern Epi Founders", "Peter Ludwig Panum studied an 1846 measles epidemic in which place?", "The Faroe Islands", ["Iceland", "The Isle of Wight", "Hawaii"], "The isolated islands let Panum trace exactly when and how measles spread."],
  ["Modern Epi Founders", "What did Panum establish about measles?", "An incubation period of about 14 days and lifelong immunity after infection", ["That measles spreads through water", "That a bacterium causes measles", "That a vaccine prevents measles"], "Older residents who had measles in a 1781 epidemic did not get sick again."],
  ["Modern Epi Founders", "Ignaz Semmelweis made his famous discovery at which hospital?", "Vienna General Hospital", ["St. Thomas' Hospital, London", "Hôtel-Dieu, Paris", "Charité, Berlin"], "He worked in the maternity wards there in 1847."],
  ["Modern Epi Founders", "Ignaz Semmelweis studied which disease?", "Puerperal (childbed) fever", ["Typhoid", "Cholera", "Scurvy"], "Puerperal fever killed many new mothers after childbirth."],
  ["Modern Epi Founders", "What intervention did Semmelweis introduce?", "Handwashing with chlorinated lime", ["Carbolic acid spray during surgery", "Boiling surgical instruments", "Isolating every patient"], "Deaths dropped sharply once doctors washed their hands after autopsies."],
  ["Modern Epi Founders", "What key observation led Semmelweis to his discovery?", "Deaths were much higher in the doctors' ward than in the midwives' ward", ["Deaths were higher in summer than winter", "Only wealthy mothers got sick", "Deaths were higher near open windows"], "Doctors came straight from autopsies; midwives did not do autopsies."],
  ["Modern Epi Founders", "Who wrote an 1843 essay arguing that physicians spread puerperal fever, before Semmelweis?", "Oliver Wendell Holmes Sr.", ["Joseph Lister", "John Snow", "Lemuel Shattuck"], "Holmes, an American physician and writer, reached a similar conclusion a few years earlier."],
  ["Modern Epi Founders", "Florence Nightingale's sanitation work took place during which war?", "The Crimean War", ["The American Civil War", "World War I", "The Boer War"], "At the Scutari hospital, she showed most soldier deaths came from preventable disease."],
  ["Modern Epi Founders", "Which chart is Florence Nightingale famous for?", "The polar-area ('coxcomb') diagram", ["The spot map", "The epidemic curve", "The box plot"], "Her wedge-shaped diagrams showed preventable deaths dwarfed battle wounds."],
  ["Modern Epi Founders", "Who was the first woman elected to the Royal Statistical Society?", "Florence Nightingale", ["S. Josephine Baker", "Janet Lane-Claypon", "Lillian Wald"], "Nightingale was elected in 1858."],
  ["Modern Epi Founders", "Who wrote the 1842 'Report on the Sanitary Condition of the Labouring Population of Great Britain'?", "Edwin Chadwick", ["Lemuel Shattuck", "William Farr", "John Snow"], "Chadwick tied poor sanitation to disease and early death among the working poor."],
  ["Modern Epi Founders", "Edwin Chadwick's sanitary report led to which law?", "The Public Health Act of 1848", ["The Vaccination Act of 1853", "The founding of the WHO", "The founding of the CDC"], "The act created a General Board of Health in England."],
  ["Modern Epi Founders", "Who wrote the 1850 'Report of the Sanitary Commission of Massachusetts'?", "Lemuel Shattuck", ["Edwin Chadwick", "C.-E. A. Winslow", "Alexander Langmuir"], "Shattuck's report is considered a blueprint for US public health."],
  ["Modern Epi Founders", "What did Lemuel Shattuck's 1850 report call for?", "State and local boards of health and vital records", ["A national vaccine program", "Closing all public wells", "A federal disease agency in Atlanta"], "Many of its recommendations were adopted decades later."],
  ["Modern Epi Founders", "Who showed that typhoid fever spreads through contaminated feces and water?", "William Budd", ["John Snow", "Mary Mallon", "George Soper"], "Budd's work in England paralleled Snow's work on cholera."],
  ["Modern Epi Founders", "Which physician founded 'social medicine' and said medicine is a social science?", "Rudolf Virchow", ["Robert Koch", "Louis Pasteur", "Edwin Chadwick"], "Virchow also founded cellular pathology."],
  ["Modern Epi Founders", "Rudolf Virchow's 1848 report on typhus in Upper Silesia blamed the outbreak mainly on what?", "Poverty and poor social conditions", ["Contaminated water", "Mosquitoes", "A new bacterium he discovered"], "He recommended education, democracy and better living conditions as the cure."],

  // ---------- Germ theory & vectors ----------
  ["Germ Theory & Vectors", "Who was the first person to see microorganisms, which he called 'animalcules'?", "Antonie van Leeuwenhoek", ["Robert Hooke", "Louis Pasteur", "Robert Koch"], "Leeuwenhoek built his own microscopes and described bacteria and protozoa in the 1670s."],

/* =========================================================
   STATE (saved in the browser so a refresh doesn't lose progress)
   ========================================================= */
const STORE_KEY = "kraemerDDQuiz_v1";
let state = null;

function freshState(shuffleQuestions) {
  const order = BANK.map((_, i) => i);
  if (shuffleQuestions) shuffle(order);
  // pre-shuffle each question's choices once, so they stay put on refresh
  const choiceOrders = BANK.map(() => shuffle([0, 1, 2, 3]));
  const points = {};
  STUDENTS.forEach(s => points[s] = 0);
  return {
    started: true, finished: false,
    order, choiceOrders, pos: 0,
    screen: "question",          // "question" | "result"
    lastPick: null,              // index into the 4 displayed choices
    answered: {},                // bankIndex -> { correct: bool }
    awards: {},                  // bankIndex -> [student names]
    points
  };
}

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.order) || s.order.length !== BANK.length) return null;
    return s;
  } catch (e) { return null; }
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* =========================================================
   RENDERING
   ========================================================= */
const app = document.getElementById("app");
const LETTERS = ["A", "B", "C", "D"];

function currentQ() {
  const bi = state.order[state.pos];
  const [cat, q, correct, wrong, explain] = BANK[bi];
  const all = [correct, ...wrong];                       // index 0 is always the correct one
  const display = state.choiceOrders[bi].map(k => ({ text: all[k], isCorrect: k === 0 }));
  return { bi, cat, q, correct, explain, display };
}

function renderStart() {
  document.getElementById("progressWrap").hidden = true;
  const saved = load();
  const cats = [...new Set(BANK.map(b => b[0]))];
  const counts = cats.map(c => `${c} (${BANK.filter(b => b[0] === c).length})`);
  const canResume = saved && !saved.finished && saved.started;
  app.innerHTML = `
    <section class="card intro">
      <span class="tag">Science Olympiad · Disease Detectives</span>
      <h2>Famous Figures Challenge</h2>
      <p><b>${BANK.length} questions</b> on the epidemiologists and public health pioneers who show up on Disease Detectives tests.</p>
      <p>One question per screen. Pick an answer, see if it was right, then award a point to the classmate(s) who got it. Scores stay at the bottom of the screen.</p>
      <ul class="cat-list">${counts.map(c => `<li>${esc(c)}</li>`).join("")}</ul>
      <div class="roster">${STUDENTS.map(s => `<span>${esc(s)}</span>`).join("")}</div>
      <div class="nav-row" style="justify-content:flex-start">
        ${canResume ? `<button class="primary-btn" id="resumeBtn">Resume (question ${saved.pos + 1})</button>` : ""}
        <button class="${canResume ? "secondary-btn" : "primary-btn"}" id="startOrdered">Start in order</button>
        <button class="secondary-btn" id="startShuffled">Start shuffled</button>
      </div>
      <p class="hint">Tip: press <span class="kbd">1</span>–<span class="kbd">4</span> or <span class="kbd">A</span>–<span class="kbd">D</span> to answer, and <span class="kbd">Enter</span> for the next question. Starting a new game resets the scoreboard.</p>
    </section>`;
  if (canResume) document.getElementById("resumeBtn").onclick = () => { state = saved; render(); };
  document.getElementById("startOrdered").onclick = () => newGame(false);
  document.getElementById("startShuffled").onclick = () => newGame(true);
}

function newGame(shuffled) {
  const existing = load();
  if (existing && existing.started && !existing.finished && existing.pos > 0) {
    if (!confirm("Start a new game? This clears the current scores.")) return;
  }
  state = freshState(shuffled);
  save();
  render();
}

function renderProgress() {
  const wrap = document.getElementById("progressWrap");
  wrap.hidden = false;
  const n = BANK.length;
  const done = Object.keys(state.answered).length;
  document.getElementById("progressText").textContent = `Question ${state.pos + 1} of ${n}`;
  const pct = Math.round(done / n * 100);
  document.getElementById("progressPct").textContent = `${pct}% complete`;
  document.getElementById("progressFill").style.width = pct + "%";
}

function renderQuestion() {
  renderProgress();
  const { cat, q, display } = currentQ();
  app.innerHTML = `
    <section class="card">
      <span class="tag">${esc(cat)}</span>
      <h2 class="question">${esc(q)}</h2>
      <div class="choices">
        ${display.map((c, i) => `
          <button class="choice" data-i="${i}">
            <span class="letter">${LETTERS[i]}</span><span>${esc(c.text)}</span>
          </button>`).join("")}
      </div>
    </section>`;
  app.querySelectorAll(".choice").forEach(btn => btn.onclick = () => pick(Number(btn.dataset.i)));
}

function pick(i) {
  const { bi, display } = currentQ();
  state.lastPick = i;
  state.answered[bi] = { correct: display[i].isCorrect };
  state.screen = "result";
  save();
  render();
}

function renderResult() {
  renderProgress();
  const { bi, q, correct, explain, display } = currentQ();
  const picked = display[state.lastPick];
  const ok = picked && picked.isCorrect;
  const awarded = state.awards[bi] || [];
  const isLast = state.pos === BANK.length - 1;
  app.innerHTML = `
    <section class="card">
      <div class="verdict ${ok ? "good" : "bad"}">
        <div class="icon">${ok ? "✓" : "✗"}</div>
        <h2>${ok ? "Correct!" : "Not quite"}</h2>
      </div>
      <p class="recap-q">${esc(q)}</p>
      ${ok ? "" : `<div class="answer-row wrong"><b>Answer selected</b>${esc(picked ? picked.text : "")}</div>`}
      <div class="answer-row right"><b>Correct answer</b>${esc(correct)}</div>
      <div class="explain"><b>Why:</b> ${esc(explain)}</div>

      <div class="award">
        <h3>Award a point</h3>
        <p>Tap each student who got this one right. Tap again to take the point back.</p>
        <div class="award-grid">
          ${STUDENTS.map(s => `<button class="award-btn ${awarded.includes(s) ? "on" : ""}" data-s="${esc(s)}">${esc(s)}</button>`).join("")}
        </div>
      </div>

      <div class="nav-row">
        <button class="primary-btn" id="nextBtn">${isLast ? "See final results" : "Next question →"}</button>
      </div>
    </section>`;
  app.querySelectorAll(".award-btn").forEach(btn => btn.onclick = () => toggleAward(bi, btn.dataset.s));
  document.getElementById("nextBtn").onclick = next;
}

function toggleAward(bi, name) {
  const list = state.awards[bi] || (state.awards[bi] = []);
  const at = list.indexOf(name);
  if (at === -1) { list.push(name); state.points[name] += 1; }
  else { list.splice(at, 1); state.points[name] -= 1; }
  save();
  // update just the tapped button so the card doesn't flicker
  const btn = [...app.querySelectorAll(".award-btn")].find(b => b.dataset.s === name);
  if (btn) btn.classList.toggle("on", list.includes(name));
  renderScoreboard();
}

function next() {
  if (state.pos >= BANK.length - 1) {
    state.finished = true;
    save();
    render();
    return;
  }
  state.pos += 1;
  state.screen = "question";
  state.lastPick = null;
  save();
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderEnd() {
  document.getElementById("progressWrap").hidden = true;
  const ranked = STUDENTS.map(s => ({ s, p: state.points[s] })).sort((a, b) => b.p - a.p);
  const top = ranked[0].p;
  const vals = Object.values(state.answered);
  const right = vals.filter(v => v.correct).length;
  app.innerHTML = `
    <section class="card intro">
      <span class="tag">Final results</span>
      <h2>${top > 0 ? "Champion: " + ranked.filter(r => r.p === top).map(r => esc(r.s)).join(" & ") : "Quiz complete!"}</h2>
      <p>The class answered <b>${right}</b> of <b>${vals.length}</b> questions correctly (${vals.length ? Math.round(right / vals.length * 100) : 0}%).</p>
      <div class="podium">
        ${ranked.map((r, i) => {
          const rank = ranked.findIndex(x => x.p === r.p) + 1;
          return `<div class="podium-row ${r.p === top && top > 0 ? "first" : ""}"><span class="rank">${rank}</span><span>${esc(r.s)}</span><span class="pts">${r.p} pt${r.p === 1 ? "" : "s"}</span></div>`;
        }).join("")}
      </div>
      <div class="nav-row" style="justify-content:flex-start">
        <button class="primary-btn" id="againOrdered">Play again in order</button>
        <button class="secondary-btn" id="againShuffled">Play again shuffled</button>
      </div>
    </section>`;
  document.getElementById("againOrdered").onclick = () => { state = freshState(false); save(); render(); };
  document.getElementById("againShuffled").onclick = () => { state = freshState(true); save(); render(); };
}

function renderScoreboard() {
  const pts = state ? state.points : Object.fromEntries(STUDENTS.map(s => [s, 0]));
  const max = Math.max(...STUDENTS.map(s => pts[s]));
  document.getElementById("sbGrid").innerHTML = STUDENTS.map(s => `
    <div class="sb-chip ${pts[s] === max && max > 0 ? "leader" : ""}">
      <div class="nm">${esc(s)}</div>
      <div class="pt">${pts[s]}</div>
      <div class="adj">
        <button data-adj="-1" data-s="${esc(s)}" title="Remove a point from ${esc(s)}" aria-label="Remove a point from ${esc(s)}">−</button>
        <button data-adj="1" data-s="${esc(s)}" title="Add a point to ${esc(s)}" aria-label="Add a point to ${esc(s)}">+</button>
      </div>
    </div>`).join("");
  document.querySelectorAll(".sb-chip .adj button").forEach(b => b.onclick = () => {
    if (!state) return;
    state.points[b.dataset.s] += Number(b.dataset.adj);
    save();
    renderScoreboard();
  });
  const vals = state ? Object.values(state.answered) : [];
  const right = vals.filter(v => v.correct).length;
  document.getElementById("classScore").textContent =
    `Class answers: ${right} correct of ${vals.length}` + (vals.length ? ` (${Math.round(right / vals.length * 100)}%)` : "");
}

function render() {
  if (!state || !state.started) renderStart();
  else if (state.finished) renderEnd();
  else if (state.screen === "result") renderResult();
  else renderQuestion();
  renderScoreboard();
}

/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */
document.addEventListener("keydown", e => {
  if (!state || !state.started || state.finished) return;
  if (state.screen === "question") {
    const map = { "1": 0, "2": 1, "3": 2, "4": 3, a: 0, b: 1, c: 2, d: 3 };
    const k = e.key.toLowerCase();
    if (k in map) pick(map[k]);
  } else if (state.screen === "result" && e.key === "Enter") {
    next();
  }
});

/* =========================================================
   LOGO FALLBACK (shows a simple badge until kraemer-logo.png is added)
   ========================================================= */
function showLogoFallback() {
  document.getElementById("logoWrap").innerHTML = `
    <div class="logo-fallback" title="Add kraemer-logo.png to show the school logo">
      <svg width="38" height="38" viewBox="0 0 64 64" aria-hidden="true">
        <g fill="#0b2a5b">
          <ellipse cx="32" cy="42" rx="14" ry="12"/>
          <ellipse cx="14" cy="26" rx="6" ry="8"/>
          <ellipse cx="26" cy="16" rx="6" ry="8"/>
          <ellipse cx="38" cy="16" rx="6" ry="8"/>
          <ellipse cx="50" cy="26" rx="6" ry="8"/>
        </g>
      </svg>
    </div>`;
}
const logoImg = document.getElementById("logoImg");
logoImg.addEventListener("error", showLogoFallback);
// the image may have already failed before this script ran
if (logoImg.complete && logoImg.naturalWidth === 0) showLogoFallback();

document.getElementById("homeBtn").onclick = () => {
  if (state) save();
  state = null;
  render();
};

/* ===== Boot ===== */
state = null;
render();
</script>
</body>
</html>
